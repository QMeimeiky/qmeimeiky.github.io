name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A5D3A9: ${{ secrets.A5D3A9 }}
          B3FD53: ${{ secrets.B3FD53 }}
        run: |
          python3 -c "
          import os, sys, pathlib
          tag_a = os.environ.get('A5D3A9', '')
          tag_b = os.environ.get('B3FD53', '')
          fpath = pathlib.Path('index.html')
          orig = fpath.read_text(encoding='utf-8')
          updated = orig
          if tag_a:
              updated = updated.replace('<!-- bce3b3153e8d3b905db21ee2b7e16d5f5217ab604800a7 -->', tag_a)
          if tag_b:
              updated = updated.replace('<!-- 8a18f2fa5c689b666ac7af5667 -->', tag_b)
          if updated == orig and (tag_a or tag_b):
              sys.exit(1)
          if updated != orig:
              fpath.write_text(updated, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
